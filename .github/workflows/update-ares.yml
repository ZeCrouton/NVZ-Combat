name: Mise à jour des combats Ares

on:
  schedule:
    - cron: "30 5,11,17 * * *"   # 3 fois par jour (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ares
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les combats Ares
        run: python3 scripts/update_ares.py
      - name: Commit si changement
        run: |
          if [ -z "$(git status --porcelain -- data/auto-fights.json)" ]; then
            echo "Aucun changement à committer."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto-fights.json
          git commit -m "Mise à jour des combats Ares"
          git pull --rebase origin main
          git push
