name: Recon (temporaire)
on: { workflow_dispatch: {} }
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          curl -sSL -A "$UA" -H "Accept-Language: fr" -o e.html https://next-fight.com/fr/event/ares-46-tbd-vs-tbd
          curl -sSL -A "$UA" -o p.html https://next-fight.com/en/organization/pfl
          python3 - <<'PY'
          import re,html
          h=open("e.html",encoding="utf-8").read()
          h=re.sub(r'<script.*?</script>','',h,flags=re.S); h=re.sub(r'\s(class|style|srcSet|sizes)="[^"]*"','',h)
          for k in ("Canal","CANAL","Fight Pass","regarder","diffus","Broadcast"):
              for m in list(re.finditer(k,h))[:2]: print("##",k,":",html.unescape(re.sub(r'<[^>]+>',' | ',h[m.start()-300:m.start()+300])))
          p=open("p.html",encoding="utf-8").read()
          print("PFL links:",sorted(set(re.findall(r'href="(/en/event/[^"#?]+)"',p))))
          PY
