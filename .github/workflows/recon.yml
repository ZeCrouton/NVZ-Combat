name: Recon (temporaire)
on: { workflow_dispatch: {} }
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0 (compatible; NVZ-Combat-bot)" -o p.html https://next-fight.com/en/event/ares-43-paris
          python3 - <<'PY'
          import re
          h=open("p.html",encoding="utf-8").read()
          h=re.sub(r'<script.*?</script>','',h,flags=re.S)
          h=re.sub(r'\s(class|style)="[^"]*"','',h); h=re.sub(r'<(svg|path)[^>]*>|</(svg|path)>','',h)
          i=h.find('/en/fighter/'); print(h[i-600:i+5000])
          PY
