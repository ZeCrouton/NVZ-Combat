name: Reconnaissance Ares (temporaire)

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: JSON-LD des pages Ares
        run: |
          UA="Mozilla/5.0 (compatible; NVZ-Combat-bot)"
          curl -sSL -A "$UA" -o org.html https://next-fight.com/en/organization/ares-fc
          curl -sSL -A "$UA" -o ev.html https://next-fight.com/en/event/ares-45-zebo-vs-baki-2
          python3 - <<'PY'
          import re, json
          for f in ("org.html", "ev.html"):
              h = open(f, encoding="utf-8").read()
              print("=====", f)
              for m in re.finditer(r'<script[^>]*application/ld\+json[^>]*>(.*?)</script>', h, re.S):
                  print(m.group(1)[:3500]); print("-----")
          PY
