name: Reconnaissance Ares (temporaire)

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les pages Ares
        run: |
          UA="Mozilla/5.0 (compatible; NVZ-Combat-bot)"
          curl -sSL -A "$UA" -o org.html -w "org %{http_code} %{size_download}\n" https://next-fight.com/en/organization/ares-fc
          curl -sSL -A "$UA" -o ev.html -w "event %{http_code} %{size_download}\n" https://next-fight.com/en/event/ares-45-zebo-vs-baki-2
          echo "=== liens /event/ de la page organisation ==="
          grep -oE 'href="[^"]*/event/[^"]*"' org.html | sort -u | head -40
          echo "=== JSON-LD / NEXT_DATA ? ==="
          grep -c 'application/ld+json' ev.html org.html || true
          grep -c '__NEXT_DATA__' ev.html org.html || true
          echo "=== texte de la page événement (extrait) ==="
          sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/\n/g' ev.html | grep -v '^\s*$' | head -120
