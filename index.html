    }

}

function icon(name) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>'; }

var S = { fights: [], status: "loading", offline: false, tier: "star", sport: null, fr: false, searching: false, q: "", loading: false };
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
var plain = function (s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); };
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

/* Traitement et Parsage des Données */
function parisToday() { return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Paris" }).format(new Date()); }
function addMonths(iso, n) { var p = iso.split("-").map(Number); var d = new Date(Date.UTC(p[0], p[1] - 1 + n, p[2])); return d.toISOString().slice(0, 10); }
function sportLabel(s) { s = String(s).toLowerCase(); return s === "mma" ? "MMA" : s === "boxe" ? "Boxe" : /kick/.test(s) ? "Kick-boxing" : s.charAt(0).toUpperCase() + s.slice(1); }
var dFmt = {
  dow: new Intl.DateTimeFormat("fr-FR", { weekday: "short" }), day: new Intl.DateTimeFormat("fr-FR", { day: "numeric" }),
  mon: new Intl.DateTimeFormat("fr-FR", { month: "short" }), month: new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric" }),
  long: new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", year: "numeric" }), short: new Intl.DateTimeFormat("fr-FR", { day: "2-digit", month: "2-digit" })
};
function dateOf(iso) { var p = iso.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function nz(v) { return v == null || String(v).trim() === "" ? null : String(v).trim(); }

function parse(rows) {
  var out = [];
  rows.forEach(function (o) {
    var a = nz(o.fighter_a), b = nz(o.fighter_b);
    if (!a || !b || !o.event_date) return;
    var f = {
      id: o.id || (o.event_date + a + b), sport: nz(o.sport) || "mma", org: nz(o.organization) || "", event: nz(o.event_name) || "",
      date: String(o.event_date), time: nz(o.start_time_paris), loc: nz(o.location), a: a, b: b, weight: nz(o.weight_class), title: nz(o.title),
      pos: nz(o.card_position) || "card", fr: !!o.french_involved, hype: Math.max(0, Math.min(100, Number(o.hype_score) || 0)), why: nz(o.hype_reason),
      tier: ["star", "important"].indexOf(o.tier) >= 0 ? o.tier : "autre",
      tv: Array.isArray(o.broadcasters) ? o.broadcasters.map(nz).filter(Boolean) : [],
      seen: o.last_seen_at ? Date.parse(o.last_seen_at) : null
    };
    var d = dateOf(f.date);
    f.key = plain([a, b, f.org, f.event, sportLabel(f.sport), f.loc || "", f.tv.join(" "), f.weight || "", f.title || "", f.fr ? "francais" : "", dFmt.long.format(d), dFmt.short.format(d)].join(" "));
    out.push(f);
  });
  out.sort(function (x, y) { return x.date < y.date ? -1 : x.date > y.date ? 1 : y.hype - x.hype; });
  return out;
}

function fetchRows() {
  var t = parisToday();
  var url = BASE_URL + "/rest/v1/fights?select=" + COLUMNS + "&event_date=gte." + t + "&event_date=lte." + addMonths(t, WINDOW_MONTHS) +
    "&order=event_date.asc,hype_score.desc&limit=1000";
  var h = { apikey: API_KEY, Accept: "application/json" };
  if (API_KEY.indexOf("sb_") !== 0) h.Authorization = "Bearer " + API_KEY;
  var ctl = new AbortController(); var timer = setTimeout(function () { ctl.abort(); }, 12000);
  return fetch(url, { headers: h, signal: ctl.signal }).then(function (r) {
    clearTimeout(timer);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  });
}

function load(manual) {
  if (S.loading) return;
  S.loading = true; $("#btnRefresh").classList.add("spin");
  fetchRows().then(function (raw) {
    var list = parse(JSON.parse(raw));
    if (!list.length) throw new Error("Données vides");
    store("nvz-cache", raw);
    S.fights = list; S.status = "ok"; S.offline = false;
  }).catch(function () {
    // Utiliser le cache local ou la mock data de secours
    var cached = store("nvz-cache");
    if (cached) {
      try {
        var list = parse(JSON.parse(cached)).filter(function (f) { return f.date >= parisToday(); });
        if (list.length) { S.fights = list; S.status = "ok"; S.offline = true; return; }
      } catch (e) {}
    }
    // Fallback Mock Data
    S.fights = parse(getMockFights());
    S.status = "ok";
    S.offline = true;
  }).then(function () {
    S.loading = false; $("#btnRefresh").classList.remove("spin"); render();
  });
}

/* Affichage HTML */
function relative(ts) {
  if (!ts) return "récemment";
  var m = Math.max(0, Math.floor((Date.now() - ts) / 60000));
  var p = function (n, u) { return "il y a " + n + " " + u + (n > 1 ? "s" : ""); };
  return m < 1 ? "à l'instant" : m < 60 ? p(m, "minute") : m < 1440 ? p(Math.floor(m / 60), "heure") : p(Math.floor(m / 1440), "jour");
}

function cardHTML(f, i) {
  var d = dateOf(f.date);
  var pos = f.pos === "main" ? "Combat principal" : f.pos === "co-main" ? "Co-main event" : null;
  var pills = "";
  if (f.title) pills += '<span class="pill title">' + icon("trophy") + esc(f.title) + "</span>";
  if (f.weight) pills += '<span class="pill">' + esc(f.weight) + "</span>";
  if (pos) pills += '<span class="pill">' + pos + "</span>";
  if (f.fr) pills += '<span class="pill fr">🇫🇷 Français</span>';
  var tv = f.tv.length ? '<div class="b">' + f.tv.map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("") + "</div>" : "<span>Diffuseur en France à confirmer</span>";
  return '<article class="card" data-tier="' + f.tier + '" style="--i:' + Math.min(i, 8) + '">' +
    '<div class="head"><div class="who"><div class="date">' + esc(dFmt.dow.format(d)) + "<b>" + esc(dFmt.day.format(d)) + "</b>" + esc(dFmt.mon.format(d)) + "</div>" +
    '<div class="info"><div class="org">' + esc(f.org) + "</div>" + (f.event ? '<div class="evt">' + esc(f.event) + "</div>" : "") +
    (f.time ? '<div class="time">Début <b>' + esc(f.time) + "</b> (heure de Paris)</div>" : "") + "</div></div>" +
    '<span class="sport">' + esc(sportLabel(f.sport)) + "</span></div>" +
    '<div class="vs"><span class="n">' + esc(f.a) + '</span><span class="x">VS</span><span class="n">' + esc(f.b) + "</span></div>" +
    (pills ? '<div class="pills">' + pills + "</div>" : "") +
    '<div class="hype"><div class="l"><span>Hype</span><b>' + f.hype + '/100</b></div><div class="meter"><i style="width:' + f.hype + '%"></i></div>' +
    (f.why ? '<p class="why">' + esc(f.why) + "</p>" : "") + "</div>" +
    '<div class="foot"><div class="tv">' + icon("tv") + tv + "</div>" + (f.loc ? '<div class="loc">' + icon("pin") + esc(f.loc) + "</div>" : "") + "</div></article>";
}

function emptyHTML(title, text, retry) {
  return '<div class="empty"><h3>' + esc(title) + "</h3><p>" + esc(text) + "</p>" + (retry ? '<button type="button" data-act="retry">Réessayer</button>' : "") + "</div>";
}

function render() {
  var fights = S.fights;
  var sports = []; fights.forEach(function (f) { if (sports.indexOf(f.sport) < 0) sports.push(f.sport); });
  var order = ["mma", "boxe", "kickboxing"];
  sports.sort(function (x, y) { var a = order.indexOf(x.toLowerCase()), b = order.indexOf(y.toLowerCase()); return (a < 0 ? 99 : a) - (b < 0 ? 99 : b); });
  var sport = sports.indexOf(S.sport) >= 0 ? S.sport : null;

  var base = fights.filter(function (f) { return (!sport || f.sport === sport) && (!S.fr || f.fr); });
  var counts = { star: 0, important: 0, autre: 0 }; base.forEach(function (f) { counts[f.tier]++; });
  var searchOn = S.searching && S.q.trim() !== "";
  var shown;
  if (searchOn) {
    var terms = plain(S.q).split(/\s+/).filter(Boolean);
    shown = fights.filter(function (f) { return terms.every(function (t) { return f.key.indexOf(t) >= 0; }); });
  } else shown = base.filter(function (f) { return f.tier === S.tier; });

  $("#tabs").innerHTML = TIERS.map(function (t) {
    var n = counts[t[0]];
    return '<button class="tab" type="button" data-tier="' + t[0] + '" data-act="tier" aria-pressed="' + (S.tier === t[0]) + '"><span class="t">' + icon(t[2]) + t[1] + '</span><span class="n">' + n + " combat" + (n > 1 ? "s" : "") + "</span></button>";
  }).join("");
  $("#chips").innerHTML = '<button class="chip" type="button" data-act="sport" data-v="" aria-pressed="' + (!sport) + '">Tout</button>' +
    sports.map(function (s) { return '<button class="chip" type="button" data-act="sport" data-v="' + esc(s) + '" aria-pressed="' + (sport === s) + '">' + esc(sportLabel(s)) + "</button>"; }).join("") +
    '<button class="chip fr" type="button" data-act="fr" aria-pressed="' + S.fr + '">🇫🇷 Avec un Français</button>';

  var html = "";
  if (S.status === "loading" && !fights.length) html = '<div class="load"><div class="ring" role="status" aria-label="Chargement"></div></div>';
  else if (S.status === "failed") html = emptyHTML("Impossible de charger", "Vérifiez votre connexion, puis réessayer.", true);
  else if (!fights.length) html = emptyHTML("La liste se remplit", "Les premiers combats arrivent avec la prochaine mise à jour.");
  else if (searchOn && !shown.length) html = emptyHTML("Aucun résultat", "Aucun combat ne correspond à « " + S.q.trim() + " ».");
  else if (!shown.length) html = emptyHTML("Rien ici pour l'instant", "Aucun combat ne correspond à ces filtres.");
  else {
    if (searchOn) html += '<p class="count">' + shown.length + " résultat" + (shown.length > 1 ? "s" : "") + "</p>";
    var groups = [], idx = {};
    shown.forEach(function (f) { var k = f.date.slice(0, 7); if (!(k in idx)) { idx[k] = groups.length; groups.push([k, []]); } groups[idx[k]][1].push(f); });
    groups.forEach(function (g) {
      var label = dFmt.month.format(dateOf(g[0] + "-01")); label = label.charAt(0).toUpperCase() + label.slice(1);
      html += '<section><div class="month"><h2>' + esc(label) + "</h2><span>" + g[1].length + " combat" + (g[1].length > 1 ? "s" : "") + '</span></div><div class="list">' +
        g[1].map(cardHTML).join("") + "</div></section>";
    });
  }
  $("#main").innerHTML = html;

  var seen = fights.map(function (f) { return f.seen; }).filter(Boolean);
  var foot = "";
  if (seen.length) foot += "<p>Liste mise à jour automatiquement — dernière mise à jour " + relative(Math.max.apply(null, seen)) + ".</p>";
  if (S.offline) foot += "<p>Mode déconnecté / Données de démonstration : les dernières informations enregistrées sont affichées.</p>";
  foot += "<p>Les combats plus lointains apparaissent dès leur annonce officielle. Infos compilées depuis le web : dates, horaires et diffuseurs peuvent changer. Vérifiez auprès du diffuseur avant le combat.</p>";
  $("#footer").innerHTML = foot;
}

/* Gestions des Événements & Interactions */
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]"); if (!el) return;
  var act = el.getAttribute("data-act");
  if (act === "tier") {
    S.tier = el.getAttribute("data-tier"); render();
    var bar = $("#bar"); if (window.scrollY > $(".hero").offsetHeight) window.scrollTo({ top: $(".hero").offsetHeight, behavior: "smooth" });
  } else if (act === "sport") { S.sport = el.getAttribute("data-v") || null; render(); }
  else if (act === "fr") { S.fr = !S.fr; render(); }
  else if (act === "retry") { S.status = "loading"; render(); load(true); }
});

function setSearch(on) {
  S.searching = on; if (!on) { S.q = ""; $("#q").value = ""; }
  $("#normal").hidden = on; $("#searchrow").hidden = !on; render();
  if (on) $("#q").focus();
}

$("#btnSearch").addEventListener("click", function () { setSearch(true); });
$("#btnCancel").addEventListener("click", function () { setSearch(false); });
$("#q").addEventListener("input", function (e) { S.q = e.target.value; render(); });
$("#q").addEventListener("keydown", function (e) { if (e.key === "Escape") setSearch(false); });
$("#btnRefresh").addEventListener("click", function () { load(true); });

/* Gestion des Thèmes & Personnalisation */
function applyTheme(dark, accentIndex) {
  var root = document.documentElement;
  root.setAttribute("data-theme", dark ? "dark" : "light");
  root.style.setProperty("--primary", ACCENTS[accentIndex][1]);
  $("#tgDark").setAttribute("aria-checked", String(dark));
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = dark ? "#0D0908" : "#FAF7F2";
  Array.prototype.forEach.call(document.querySelectorAll(".sh"), function (b, i) { b.setAttribute("aria-pressed", String(i === accentIndex)); });
}

var prefs = { dark: store("nvz-dark") !== "0", accent: Math.max(0, Math.min(ACCENTS.length - 1, parseInt(store("nvz-accent"), 10) || 0)) };
$("#swatches").innerHTML = ACCENTS.map(function (a, i) { return '<button class="sh" type="button" data-i="' + i + '" style="--c:' + a[1] + '" aria-pressed="false"><i></i>' + a[0] + "</button>"; }).join("");
$("#swatches").addEventListener("click", function (e) { var b = e.target.closest(".sh"); if (!b) return; prefs.accent = +b.getAttribute("data-i"); store("nvz-accent", String(prefs.accent)); applyTheme(prefs.dark, prefs.accent); });
$("#tgDark").addEventListener("click", function () { prefs.dark = !prefs.dark; store("nvz-dark", prefs.dark ? "1" : "0"); applyTheme(prefs.dark, prefs.accent); });

function openPanel(on) { $("#scrim").hidden = !on; if (on) $("#btnClose").focus(); else $("#btnSettings").focus(); }
$("#btnSettings").addEventListener("click", function () { openPanel(true); });
$("#btnClose").addEventListener("click", function () { openPanel(false); });
$("#scrim").addEventListener("click", function (e) { if (e.target === $("#scrim")) openPanel(false); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#scrim").hidden) openPanel(false); });

/* Démarrage & Initialisation */
window.onload = function() {
  $("#lead").textContent = "Les combats des " + WINDOW_MONTHS + " prochains mois, classés par la hype — et où les regarder en France.";
  applyTheme(prefs.dark, prefs.accent);
  render();
  load(false);
};
</script>
